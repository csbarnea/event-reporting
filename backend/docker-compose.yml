version: "3.9"

services:
  db:
    image: postgres:15
    container_name: incidents_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: incidents_user
      POSTGRES_PASSWORD: incidents_password
      POSTGRES_DB: incidents_db
    ports:
      - "5433:5432"   # expune Postgres pe localhost:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: incidents_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
